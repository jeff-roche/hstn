name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pip libegl1 libgl1 libxkbcommon0 libdbus-1-3 libx11-6 libxres1 udev ripgrep
          /usr/bin/python3 -m pip install --target "$RUNNER_TEMP/hstn-test-deps" -r requirements-test.txt
          printf 'PYTHONPATH=%s/hstn-test-deps\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run automated suite
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check CLI and shell syntax
        run: |
          ./scripts/hstn --help
          sh -n installer/install.sh
          git ls-files -z scripts templates/config/gamescope-session-plus/sessions.d | while IFS= read -r -d '' path; do
            if head -n 1 "$path" | rg -q '^#!.*bash'; then
              bash -n "$path"
            fi
          done
      - name: Build release archive and native staging tree
        run: |
          /usr/bin/python3 -B installer/package.py --output "$RUNNER_TEMP/hstn-release"
          /usr/bin/python3 -B installer/package.py --destdir "$RUNNER_TEMP/hstn-package-root"
          cd "$RUNNER_TEMP/hstn-release"
          sha256sum --check SHA256SUMS
      - name: Save development archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hstn-development-archive
          path: ${{ runner.temp }}/hstn-release/
          if-no-files-found: error
          retention-days: 14
